openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /plan-project:
    post:
      operationId: planProject
      summary: Understand an idea and propose a plan without building anything
      description: Server-to-server planning tool for Revi. Requires the shared webhook bearer secret, never a browser credential.
      security:
        - PlanningWebhookAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PlanningInput" }
      responses:
        "200":
          description: Either one clarification question or a proposed plan requiring explicit approval
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlanningResult" }
        "400": { description: Invalid request }
        "401": { description: Missing or incorrect webhook credentials }
        "415": { description: JSON content type required }
        "429": { description: Planning request or concurrency limit reached }
        "502": { description: Planner failed or returned an invalid response }
        "503": { description: Planning credentials or AI service not configured }
  /projects:
    get:
      operationId: listProjects
      responses:
        "200":
          description: Saved projects in this browser session
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Project" } }
    post:
      operationId: createProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProjectInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
  /projects/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getProject
      responses:
        "200":
          description: Project
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
  /projects/{id}/messages:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: sendMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MessageInput" }
      responses:
        "200":
          description: Updated project with assistant response
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
  /projects/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: approvePlan
      responses:
        "200":
          description: Approved and queued generation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
  /projects/{id}/review:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: reviewProject
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReviewInput" }
      responses:
        "200":
          description: Review saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
  /integrations:
    get:
      operationId: getIntegrations
      responses:
        "200":
          description: Real integration configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/IntegrationStatus" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
components:
  securitySchemes:
    PlanningWebhookAuth:
      type: http
      scheme: bearer
      description: PLANNING_WEBHOOK_SECRET stored on the server and in ElevenLabs secure tool authentication.
  schemas:
    PlanningInput:
      type: object
      additionalProperties: false
      required: [idea, experience_level, context]
      properties:
        idea:
          type: string
          minLength: 1
          maxLength: 10000
          description: The user's goal and desired outcome, summarized after they have finished explaining.
        experience_level:
          type: string
          enum: [Beginner, Intermediate, Advanced, Pro]
          description: The user's chosen technical explanation level. Ask if not yet known.
        context:
          type: string
          maxLength: 20000
          description: Relevant conversation summary including audience, workflow, constraints, prior clarification answers, and explicit unknowns. Never invent facts.
        constraints:
          type: array
          maxItems: 12
          description: Optional explicit user-stated constraints. Omit when unknown; an empty array does not mean the user confirmed no constraints.
          items: { type: string, minLength: 1, maxLength: 1000 }
    PlanningResult:
      type: object
      additionalProperties: false
      required: [status, reply, title, requirements, plan, approval_required]
      properties:
        status: { type: string, enum: [needs_clarification, plan_ready] }
        reply: { type: string }
        title: { type: string }
        requirements: { $ref: "#/components/schemas/Requirements" }
        plan:
          anyOf:
            - { $ref: "#/components/schemas/Plan" }
            - { type: "null" }
        approval_required:
          type: boolean
          description: Always true. This endpoint never authorizes or starts a build.
    ProjectInput:
      type: object
      required: [level]
      properties:
        level: { type: string, enum: [Beginner, Intermediate, Advanced, Pro] }
    MessageInput:
      type: object
      required: [content]
      properties:
        content: { type: string, minLength: 1, maxLength: 10000 }
    ReviewInput:
      type: object
      required: [approved]
      properties:
        approved: { type: boolean }
    Message:
      type: object
      required: [id, role, content, createdAt]
      properties:
        id: { type: string }
        role: { type: string, enum: [user, assistant] }
        content: { type: string }
        createdAt: { type: string }
    Activity:
      type: object
      required: [id, title, detail, status, createdAt]
      properties:
        id: { type: string }
        title: { type: string }
        detail: { type: string }
        status: { type: string, enum: [completed, running, failed, awaiting-approval] }
        createdAt: { type: string }
    Requirements:
      type: object
      required: [goal, audience, constraints, questions]
      properties:
        goal: { type: string }
        audience: { type: string }
        constraints: { type: array, items: { type: string } }
        questions: { type: array, items: { type: string } }
    Plan:
      type: object
      required: [title, kind, rationale, steps]
      properties:
        title: { type: string }
        kind: { type: string, enum: [tracker, checklist, calculator, information] }
        rationale: { type: string }
        steps: { type: array, items: { type: string } }
    Prototype:
      type: object
      required: [kind, title, description, items]
      properties:
        kind: { type: string, enum: [tracker, checklist, calculator, information] }
        title: { type: string }
        description: { type: string }
        items: { type: array, items: { type: string } }
    TestResult:
      type: object
      required: [name, passed, detail]
      properties:
        name: { type: string }
        passed: { type: boolean }
        detail: { type: string }
    Project:
      type: object
      required: [id, title, level, status, requirements, messages, activities, tests, reviewApproved, createdAt, updatedAt]
      properties:
        id: { type: string }
        title: { type: string }
        level: { type: string, enum: [Beginner, Intermediate, Advanced, Pro] }
        status: { type: string, enum: [discovering, awaiting-approval, building, ready, failed] }
        requirements: { $ref: "#/components/schemas/Requirements" }
        plan: { $ref: "#/components/schemas/Plan" }
        prototype: { $ref: "#/components/schemas/Prototype" }
        messages: { type: array, items: { $ref: "#/components/schemas/Message" } }
        activities: { type: array, items: { $ref: "#/components/schemas/Activity" } }
        tests: { type: array, items: { $ref: "#/components/schemas/TestResult" } }
        reviewApproved: { type: boolean }
        createdAt: { type: string }
        updatedAt: { type: string }
    IntegrationStatus:
      type: object
      required: [ai, agenticOrg, voice]
      properties:
        ai: { type: boolean }
        agenticOrg: { type: boolean }
        voice: { type: boolean }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

